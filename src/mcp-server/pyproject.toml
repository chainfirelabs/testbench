[project]
name = "testbench-mcp"
version = "0.1.0"
description = "MCP server exposing the TestBench fleet over the REST API (read-only)"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.0,<3",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
]

[project.scripts]
testbench-mcp = "tb_mcp.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tb_mcp*"]
