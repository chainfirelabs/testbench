# HSTS, but only for a request that actually reached the proxy over HTTPS, and
# only when the deployment has opted in by setting TB_HSTS_MAX_AGE (see
# .env.example). Off by default on purpose: this stack ships with Traefik's own
# self-signed certificate, and a browser that has seen HSTS for a host will not
# offer the "proceed anyway" bypass for an untrusted certificate on it — a
# default-on header would lock people out of their own test deployment with no
# way back but clearing site data.
#
# nginx omits a header whose value expands to the empty string, which is what
# makes both halves of this a no-op rather than an empty header.
map $http_x_forwarded_proto $hsts_header {
    https   "${TB_HSTS_MAX_AGE}";
    default "";
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The app is entirely same-origin: it loads no third-party script, style,
    # font or frame, and talks only to /api on this host. Saying so costs
    # nothing and turns a stray injected <script src> into a blocked request.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Strict-Transport-Security $hsts_header always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    location /api/ {
        # Docker's embedded DNS, re-checked every 10s. nginx otherwise resolves
        # the upstream once when the config loads and caches it forever, so
        # recreating the backend container (a new IP) 502s every request until
        # nginx is restarted too. proxy_pass must take a variable for the
        # resolver to be consulted at all.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream http://backend:8000;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Imports are files: the 1MB default rejects them at the proxy, before
        # the API gets to say anything useful. Matches MAX_IMPORT_BYTES.
        client_max_body_size 16m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
