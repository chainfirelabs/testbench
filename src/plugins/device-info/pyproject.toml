[project]
name = "testbench-device-info-plugin"
version = "1.0.0"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = ["fastapi>=0.111", "uvicorn>=0.30", "httpx>=0.27", "kubernetes>=30"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["device_info_plugin*"]
