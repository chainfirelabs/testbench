{{- /* Replication was configured under plugins before 1.13.2. Refuse the old
key rather than ignore it, which would turn replication off on upgrade. */}}
{{- if hasKey (.Values.plugins | default dict) "replication" }}
{{- fail "plugins.replication has moved to the top-level replication key; replication is no longer a plugin and no longer needs plugins.sharedSecret" }}
{{- end }}
{{- if and .Values.replication.enabled (ne .Values.replication.mode "receive") }}
{{- if not (has .Values.replication.mode (list "push" "push_pull")) }}{{- fail "replication.mode must be push, push_pull, or receive" }}{{- end }}
{{- $peer := required "replication.peerUrl is required" .Values.replication.peerUrl }}
{{- if not (hasPrefix "https://" $peer) }}{{- fail "replication.peerUrl must use HTTPS" }}{{- end }}
{{- $tokenSecret := required "replication.token.existingSecret is required" .Values.replication.token.existingSecret }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "testbench.fullname" . }}-replication
  labels: {{- include "testbench.labels" . | nindent 4 }}
spec:
  selector: {app.kubernetes.io/name: testbench-replication, app.kubernetes.io/instance: {{ .Release.Name }}}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "testbench.fullname" . }}-replication
  labels: {{- include "testbench.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: testbench-replication, app.kubernetes.io/instance: {{ .Release.Name }}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: testbench-replication, app.kubernetes.io/instance: {{ .Release.Name }}}
    spec:
      automountServiceAccountToken: false
      imagePullSecrets: {{ toYaml .Values.global.imagePullSecrets | nindent 8 }}
      containers:
        - name: controller
          image: {{ include "testbench.image" (dict "root" $ "image" .Values.replication.image) }}
          imagePullPolicy: {{ include "testbench.imagePullPolicy" (dict "root" $ "image" .Values.replication.image) }}
          ports: [{name: http, containerPort: 8080}]
          env:
            {{- include "testbench.globalCaEnv" . | nindent 12 }}
            - {name: TB_TESTBENCH_URL, value: {{ printf "http://%s-backend:8000/api/v1" (include "testbench.fullname" .) | quote }}}
            - {name: TB_REPLICATION_PEER_URL, value: {{ $peer | quote }}}
            - {name: TB_REPLICATION_MODE, value: {{ .Values.replication.mode | quote }}}
            - {name: TB_REPLICATION_INTERVAL_MINUTES, value: {{ .Values.replication.intervalMinutes | quote }}}
            - {name: TB_REPLICATION_ENTITIES, value: {{ .Values.replication.entities | toJson | quote }}}
            - name: TB_REPLICATION_TOKEN
              valueFrom: {secretKeyRef: {name: {{ $tokenSecret }}, key: {{ .Values.replication.token.key }}}}
          {{- if .Values.global.tls.existingConfigMap }}
          volumeMounts: {{- include "testbench.globalCaMount" . | nindent 12 }}
          {{- end }}
          readinessProbe: {httpGet: {path: /v1/health, port: http}, periodSeconds: 10}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
          securityContext: {allowPrivilegeEscalation: false, runAsNonRoot: true, capabilities: {drop: ["ALL"]}}
      {{- if .Values.global.tls.existingConfigMap }}
      volumes: {{- include "testbench.globalCaVolume" . | nindent 8 }}
      {{- end }}
{{- end }}
