{{- if .Values.plugins.networkScan.enabled }}
{{- $scanNs := include "testbench.scanNamespace" . }}
{{- if and .Values.plugins.networkScan.worker.createNamespace (ne $scanNs .Release.Namespace) }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $scanNs }}
  labels: {pod-security.kubernetes.io/enforce: restricted, app.kubernetes.io/managed-by: {{ .Release.Service }}}
---
{{- end }}
{{- end }}
{{- if .Values.plugins.reboot.enabled }}
{{- $rebootNs := include "testbench.rebootNamespace" . }}
{{- $aiUrl := .Values.plugins.reboot.ai.url }}
{{- $aiModel := .Values.plugins.reboot.ai.model }}
{{- if and (or $aiUrl $aiModel) (not (and $aiUrl $aiModel)) }}{{- fail "plugins.reboot.ai.url and model must either both be set (Helm-managed) or both be empty (GUI-managed)" }}{{- end }}
{{- $aiRepeatModel := default $aiModel .Values.plugins.reboot.ai.repeatModel }}
{{- $aiSecret := .Values.plugins.reboot.ai.existingSecret }}
{{- if and $aiUrl $aiModel }}{{- $aiSecret = required "plugins.reboot.ai.existingSecret is required for Helm-managed AI settings" $aiSecret }}{{- end }}
{{- if and .Values.plugins.reboot.worker.createNamespace (ne $rebootNs .Release.Namespace) }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $rebootNs }}
  labels: {pod-security.kubernetes.io/enforce: restricted, app.kubernetes.io/managed-by: {{ .Release.Service }}}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: {{ include "testbench.fullname" . }}-reboot-controller, namespace: {{ .Release.Namespace }}}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: {{ include "testbench.fullname" . }}-reboot-worker, namespace: {{ $rebootNs }}}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: {{ include "testbench.fullname" . }}-reboot-controller, namespace: {{ $rebootNs }}}
rules:
  - {apiGroups: ["batch"], resources: ["jobs"], verbs: ["create", "get", "list", "watch", "delete"]}
  - {apiGroups: ["batch"], resources: ["jobs/status"], verbs: ["get"]}
  - {apiGroups: [""], resources: ["pods"], verbs: ["get", "list", "watch"]}
  - {apiGroups: [""], resources: ["pods/log"], verbs: ["get"]}
  - {apiGroups: [""], resources: ["secrets"], verbs: ["create", "delete"]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: {{ include "testbench.fullname" . }}-reboot-controller, namespace: {{ $rebootNs }}}
subjects: [{kind: ServiceAccount, name: {{ include "testbench.fullname" . }}-reboot-controller, namespace: {{ .Release.Namespace }} }]
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: {{ include "testbench.fullname" . }}-reboot-controller}
---
apiVersion: v1
kind: Service
metadata: {name: {{ include "testbench.fullname" . }}-reboot, namespace: {{ .Release.Namespace }}}
spec:
  selector: {app.kubernetes.io/name: testbench-reboot, app.kubernetes.io/instance: {{ .Release.Name }}}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: {{ include "testbench.fullname" . }}-reboot, namespace: {{ .Release.Namespace }}}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: testbench-reboot, app.kubernetes.io/instance: {{ .Release.Name }}}}
  template:
    metadata: {labels: {app.kubernetes.io/name: testbench-reboot, app.kubernetes.io/instance: {{ .Release.Name }}}}
    spec:
      serviceAccountName: {{ include "testbench.fullname" . }}-reboot-controller
      imagePullSecrets: {{ toYaml .Values.global.imagePullSecrets | nindent 8 }}
      containers:
        - name: controller
          image: {{ include "testbench.image" (dict "root" $ "image" .Values.plugins.reboot.image) }}
          imagePullPolicy: {{ include "testbench.imagePullPolicy" (dict "root" $ "image" .Values.plugins.reboot.image) }}
          ports: [{name: http, containerPort: 8080}]
          env:
            - {name: TB_TESTBENCH_URL, value: {{ printf "http://%s-backend:8000/api/v1" (include "testbench.fullname" .) | quote }}}
            - {name: TB_REBOOT_WORKER_NAMESPACE, value: {{ $rebootNs | quote }}}
            - {name: TB_REBOOT_WORKER_SERVICE_ACCOUNT, value: {{ printf "%s-reboot-worker" (include "testbench.fullname" .) | quote }}}
            - {name: TB_REBOOT_WORKER_IMAGE_PULL_SECRETS, value: {{ include "testbench.imagePullSecretNames" (dict "global" .Values.global.imagePullSecrets "local" .Values.plugins.reboot.worker.imagePullSecrets) | quote }}}
            - {name: TB_REBOOT_PLUGIN_IMAGE, value: {{ include "testbench.image" (dict "root" $ "image" .Values.plugins.reboot.image) | quote }}}
            - {name: TB_REBOOT_PLUGIN_IMAGE_PULL_POLICY, value: {{ include "testbench.imagePullPolicy" (dict "root" $ "image" .Values.plugins.reboot.image) | quote }}}
            - {name: TB_REBOOT_RESEARCH_IMAGE, value: {{ include "testbench.image" (dict "root" $ "image" .Values.plugins.reboot.researchImage) | quote }}}
            - {name: TB_REBOOT_RESEARCH_IMAGE_PULL_POLICY, value: {{ include "testbench.imagePullPolicy" (dict "root" $ "image" .Values.plugins.reboot.researchImage) | quote }}}
            - {name: TB_REBOOT_METHOD, value: {{ .Values.plugins.reboot.method | quote }}}
            - {name: TB_REBOOT_SSH_COMMAND, value: {{ .Values.plugins.reboot.sshCommand | quote }}}
            - {name: TB_REBOOT_SSH_PORT, value: {{ .Values.plugins.reboot.sshPort | quote }}}
            - {name: TB_REBOOT_PROMPT, value: {{ .Values.plugins.reboot.prompt | quote }}}
            - {name: TB_REBOOT_CAPTURE_IMAGES, value: {{ .Values.plugins.reboot.captureImages | quote }}}
            - {name: TB_REBOOT_AI_SECRET_NAME, value: {{ $aiSecret | quote }}}
            - {name: TB_REBOOT_AI_SECRET_KEY, value: {{ required "plugins.reboot.ai.apiKeySecretKey is required" .Values.plugins.reboot.ai.apiKeySecretKey | quote }}}
            - {name: TB_REBOOT_AI_URL, value: {{ $aiUrl | quote }}}
            - {name: TB_REBOOT_AI_MODEL, value: {{ $aiModel | quote }}}
            - {name: TB_REBOOT_AI_REPEAT_MODEL, value: {{ $aiRepeatModel | quote }}}
            - {name: TB_REBOOT_RECOVERY_TIMEOUT_SECONDS, value: {{ .Values.plugins.reboot.recoveryTimeoutSeconds | quote }}}
            - {name: TB_REBOOT_MAX_CONCURRENT_PODS, value: {{ .Values.plugins.reboot.maxConcurrentPods | quote }}}
            - {name: TB_REBOOT_TTL_SECONDS, value: {{ .Values.plugins.reboot.worker.ttlSecondsAfterFinished | quote }}}
            - {name: TB_REBOOT_DEADLINE_SECONDS, value: {{ .Values.plugins.reboot.worker.activeDeadlineSeconds | quote }}}
            - name: TB_PLUGIN_SHARED_SECRET
              valueFrom: {secretKeyRef: {name: {{ required "plugins.sharedSecret.existingSecret is required" .Values.plugins.sharedSecret.existingSecret }}, key: {{ .Values.plugins.sharedSecret.key }}}}
          readinessProbe: {httpGet: {path: /plugin/v1/health, port: http}, periodSeconds: 10}
          securityContext: {allowPrivilegeEscalation: false, runAsNonRoot: true, capabilities: {drop: ["ALL"]}}
{{- end }}
