apiVersion: v1
kind: Service
metadata:
  name: {{ include "testbench.fullname" . }}-backend
  labels: {{- include "testbench.labels" . | nindent 4 }}
spec:
  selector: {app.kubernetes.io/name: testbench, app.kubernetes.io/component: backend, app.kubernetes.io/instance: {{ .Release.Name }}}
  ports: [{name: http, port: 8000, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "testbench.fullname" . }}-backend
  labels: {{- include "testbench.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector: {matchLabels: {app.kubernetes.io/name: testbench, app.kubernetes.io/component: backend, app.kubernetes.io/instance: {{ .Release.Name }}}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: testbench, app.kubernetes.io/component: backend, app.kubernetes.io/instance: {{ .Release.Name }}}
      annotations: {checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}}
    spec:
      serviceAccountName: {{ include "testbench.fullname" . }}-backend
      automountServiceAccountToken: false
      imagePullSecrets: {{ toYaml .Values.global.imagePullSecrets | nindent 8 }}
      containers:
        - name: backend
          image: {{ include "testbench.image" (dict "root" $ "image" .Values.backend.image) }}
          imagePullPolicy: {{ include "testbench.imagePullPolicy" (dict "root" $ "image" .Values.backend.image) }}
          command: ["/usr/bin/python3", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers"]
          ports: [{name: http, containerPort: 8000}]
          envFrom:
            - configMapRef: {name: {{ include "testbench.fullname" . }}}
            - secretRef: {name: {{ required "applicationSecret.existingSecret is required" .Values.applicationSecret.existingSecret }}}
          env:
            {{- include "testbench.databaseEnv" . | nindent 12 }}
            {{- if .Values.authentik.tls.existingConfigMap }}
            - name: SSL_CERT_FILE
              value: /etc/testbench/authentik-ca/{{ required "authentik.tls.key is required when authentik.tls.existingConfigMap is set" .Values.authentik.tls.key }}
            {{- end }}
            {{- if .Values.mcp.enabled }}
            - name: TB_MCP_INTERNAL_TOKEN
              valueFrom: {secretKeyRef: {name: {{ include "testbench.fullname" . }}-mcp-internal, key: token}}
            {{- end }}
            {{- if or .Values.plugins.networkScan.enabled .Values.plugins.deviceInfo.enabled .Values.plugins.reboot.enabled }}
            - name: TB_PLUGIN_SHARED_SECRET
              valueFrom: {secretKeyRef: {name: {{ required "plugins.sharedSecret.existingSecret is required when a plugin is enabled" .Values.plugins.sharedSecret.existingSecret }}, key: {{ .Values.plugins.sharedSecret.key }}}}
            {{- end }}
          {{- if or .Values.authentik.tls.existingConfigMap (eq .Values.schema.devices.source "configMap") }}
          # Read once at start and whenever an administrator asks the API to
          # reconcile. A ConfigMap update reaches the pod as a changed file
          # rather than as an event, so nothing here watches it.
          volumeMounts:
            {{- if .Values.authentik.tls.existingConfigMap }}
            - name: authentik-ca
              mountPath: /etc/testbench/authentik-ca
              readOnly: true
            {{- end }}
            {{- if eq .Values.schema.devices.source "configMap" }}
            - name: device-schema
              mountPath: /etc/testbench/device-schema
              readOnly: true
            {{- end }}
          {{- end }}
          startupProbe: {httpGet: {path: /api/v1/health, port: http}, periodSeconds: 3, failureThreshold: 60}
          readinessProbe: {httpGet: {path: /api/v1/health, port: http}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /api/v1/health, port: http}, periodSeconds: 20, failureThreshold: 3}
          resources: {{- toYaml .Values.backend.resources | nindent 12 }}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: ["ALL"]}}
      {{- if or .Values.authentik.tls.existingConfigMap (eq .Values.schema.devices.source "configMap") }}
      volumes:
        {{- if .Values.authentik.tls.existingConfigMap }}
        - name: authentik-ca
          configMap:
            name: {{ .Values.authentik.tls.existingConfigMap }}
            items:
              - key: {{ required "authentik.tls.key is required when authentik.tls.existingConfigMap is set" .Values.authentik.tls.key }}
                path: {{ .Values.authentik.tls.key }}
        {{- end }}
        {{- if eq .Values.schema.devices.source "configMap" }}
        - name: device-schema
          configMap:
            name: {{ required "schema.devices.existingConfigMap is required when source is configMap" .Values.schema.devices.existingConfigMap }}
        {{- end }}
      {{- end }}
