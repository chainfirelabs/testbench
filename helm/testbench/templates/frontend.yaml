apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "testbench.fullname" . }}-nginx
  labels: {{- include "testbench.labels" . | nindent 4 }}
data:
  default.conf.template: |
    server {
      listen 8080;
      root /usr/share/nginx/html;
      index index.html;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;
      add_header X-Content-Type-Options nosniff always;
      location /api/ {
        proxy_pass http://{{ include "testbench.fullname" . }}-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 16m;
      }
      location / { try_files $uri $uri/ /index.html; }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "testbench.fullname" . }}-frontend
  labels: {{- include "testbench.labels" . | nindent 4 }}
spec:
  type: {{ .Values.frontend.service.type }}
  selector: {app.kubernetes.io/name: testbench, app.kubernetes.io/component: frontend, app.kubernetes.io/instance: {{ .Release.Name }}}
  ports:
    - name: http
      port: {{ .Values.frontend.service.port }}
      targetPort: http
      {{- with .Values.frontend.service.nodePort }}
      nodePort: {{ . }}
      {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "testbench.fullname" . }}-frontend
  labels: {{- include "testbench.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector: {matchLabels: {app.kubernetes.io/name: testbench, app.kubernetes.io/component: frontend, app.kubernetes.io/instance: {{ .Release.Name }}}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: testbench, app.kubernetes.io/component: frontend, app.kubernetes.io/instance: {{ .Release.Name }}}
      annotations: {checksum/nginx: {{ .Values.frontend | toJson | sha256sum }}}
    spec:
      serviceAccountName: {{ include "testbench.fullname" . }}-frontend
      automountServiceAccountToken: false
      imagePullSecrets: {{ toYaml .Values.global.imagePullSecrets | nindent 8 }}
      containers:
        - name: frontend
          image: {{ include "testbench.image" (dict "root" $ "image" .Values.frontend.image) }}
          imagePullPolicy: {{ include "testbench.imagePullPolicy" (dict "root" $ "image" .Values.frontend.image) }}
          ports: [{name: http, containerPort: 8080}]
          volumeMounts: [{name: nginx, mountPath: /etc/nginx/templates/default.conf.template, subPath: default.conf.template, readOnly: true}]
          readinessProbe: {httpGet: {path: /, port: http}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /, port: http}, periodSeconds: 20}
          resources: {{- toYaml .Values.frontend.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes: [{name: nginx, configMap: {name: {{ include "testbench.fullname" . }}-nginx}}]
