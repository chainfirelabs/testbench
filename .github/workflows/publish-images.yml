name: Publish container images

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build and publish all images
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TB_REGISTRY: ${{ vars.TB_REGISTRY }}
          TB_IMAGE_PREFIX: ${{ vars.TB_IMAGE_PREFIX }}
          TB_REGISTRY_USER: ${{ secrets.TB_REGISTRY_USER }}
          TB_REGISTRY_PASSWORD: ${{ secrets.TB_REGISTRY_PASSWORD }}
        run: sh scripts/ci/publish-images.sh
